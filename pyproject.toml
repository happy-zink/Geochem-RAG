[project]
name = "geochem-rag"
version = "0.1.0"
description = "Evidence-grounded literature Q&A for igneous and rock geochemistry PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
